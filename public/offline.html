<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Offline — Temple Cinema</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background: #000000;
        color: #fafafa;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: calc(100% - 2rem);
        max-width: 420px;
        border: 1px solid #27272a;
        border-radius: 16px;
        background: #0d0d10;
        padding: 28px 24px;
        text-align: center;
      }
      .logo {
        width: 84px;
        height: 84px;
        border-radius: 18px;
        object-fit: contain;
        margin: 0 auto 16px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        color: #e5a93b;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.55;
        color: #a1a1aa;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: #e5a93b;
        color: #09090b;
      }
      .btn-secondary {
        background: #18181b;
        border-color: #27272a;
        color: #fafafa;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon-192.png" alt="Temple Cinema logo" class="logo" />
      <h1>You are offline</h1>
      <p>
        Temple Cinema could not reach the internet right now. Reconnect to stream trailers and upload movies, or search your cached catalog offline.
      </p>
      <div class="actions">
        <button type="button" class="btn btn-primary" onclick="window.location.reload()">
          Retry Connection
        </button>
        <a href="/?view=search" class="btn btn-secondary">
          Open Cached Offline Search
        </a>
      </div>
    </main>
  </body>
</html>
